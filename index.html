<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram-Style Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .carousel-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .carousel-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #efefef;
        }
        
        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 12px;
            background-color: #e0e0e0;
            overflow: hidden;
        }
        
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .username {
            font-weight: 600;
            font-size: 14px;
        }
        
        .carousel {
            position: relative;
            height: 500px;
            overflow: hidden;
        }
        
        .slides {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }
        
        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .navigation {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        
        .nav-btn {
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s, background-color 0.2s;
        }
        
        .carousel:hover .nav-btn {
            opacity: 1;
        }
        
        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .dots {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        
        .dot.active {
            background-color: white;
            transform: scale(1.2);
        }
        
        .carousel-footer {
            padding: 12px 16px;
        }
        
        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 16px;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .action-btn:hover {
            transform: scale(1.1);
        }
        
        .action-btn.liked {
            color: #ed4956;
        }
        
        .likes {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        
        .caption {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .username {
            font-weight: 600;
            margin-right: 4px;
        }
        
        .timestamp {
            color: #8e8e8e;
            font-size: 12px;
            margin-top: 8px;
        }
        
        @media (max-width: 640px) {
            .carousel {
                height: 400px;
            }
        }
        
        @media (max-width: 480px) {
            .carousel {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-header">
            <div class="profile-pic">
                <img src="https://via.placeholder.com/32" alt="Profile">
            </div>
            <div class="username">Miracle Drinks</div>
        </div>
        
        <div class="carousel">
            <div class="slides">
                <div class="slide">
                    <img src="./images/img-1.jpeg" alt="Mountain landscape">
                </div>
                <div class="slide">
                    <img src="./images/img-2.jpeg" alt="Forest">
                </div>
                <div class="slide">
                    <img src="./images/img-7.jpeg" alt="Lake">
                </div>
                <div class="slide">
                    <img src="./images/img-4.jpeg" alt="Beach">
                </div>
                <div class="slide">
                    <img src="./images/img-5.jpeg" alt="Tropical beach">
                </div>
                <div class="slide">
                    <img src="./images/img-6.jpeg" alt="Desert">
                </div>
                <div class="slide">
                    <img src="./images/img-3.jpeg" alt="Northern lights">
                </div>
            </div>
            
            <div class="navigation">
                <button class="nav-btn prev-btn">❮</button>
                <button class="nav-btn next-btn">❯</button>
            </div>
            
            <div class="dots">
                <!-- Dots will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="carousel-footer">
            <div class="actions">
                <div class="action-buttons">
                    <button class="action-btn like-btn">♡</button>
                    <button class="action-btn">💬</button>
                    <button class="action-btn">📤</button>
                </div>
                <button class="action-btn">🔖</button>
            </div>
            
            <div class="likes">1,247 likes</div>
            
            <div class="caption">
                <span class="username">Miracle Drinks</span>
                Exploring beautiful landscapes around the world! Which one is your favorite? 🌍✨
            </div>
            
            <div class="timestamp">2 HOURS AGO</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelector('.slides');
            const slideCount = document.querySelectorAll('.slide').length;
            const dotsContainer = document.querySelector('.dots');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            const likeBtn = document.querySelector('.like-btn');
            const likesCount = document.querySelector('.likes');
            
            let currentSlide = 0;
            let likes = 1247;
            let isLiked = false;
            
            // Create dots based on slide count
            for (let i = 0; i < slideCount; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            }
            
            const dots = document.querySelectorAll('.dot');
            
            // Update carousel position
            function updateCarousel() {
                slides.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                // Update dots
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentSlide);
                });
            }
            
            // Next slide
            function nextSlide() {
                currentSlide = (currentSlide + 1) % slideCount;
                updateCarousel();
            }
            
            // Previous slide
            function prevSlide() {
                currentSlide = (currentSlide - 1 + slideCount) % slideCount;
                updateCarousel();
            }
            
            // Go to specific slide
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentSlide = index;
                    updateCarousel();
                });
            });
            
            // Like functionality
            likeBtn.addEventListener('click', () => {
                isLiked = !isLiked;
                
                if (isLiked) {
                    likeBtn.textContent = '♥';
                    likeBtn.classList.add('liked');
                    likes++;
                } else {
                    likeBtn.textContent = '♡';
                    likeBtn.classList.remove('liked');
                    likes--;
                }
                
                likesCount.textContent = `${likes.toLocaleString()} likes`;
            });
            
            // Event listeners for navigation buttons
            nextBtn.addEventListener('click', nextSlide);
            prevBtn.addEventListener('click', prevSlide);
            
            // Auto-advance slides (optional)
            let slideInterval = setInterval(nextSlide, 5000);
            
            // Pause auto-advance on hover
            const carousel = document.querySelector('.carousel');
            carousel.addEventListener('mouseenter', () => {
                clearInterval(slideInterval);
            });
            
            carousel.addEventListener('mouseleave', () => {
                slideInterval = setInterval(nextSlide, 5000);
            });
            
            // Touch/swipe support for mobile
            let startX = 0;
            let endX = 0;
            
            carousel.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });
            
            carousel.addEventListener('touchend', (e) => {
                endX = e.changedTouches[0].clientX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeThreshold = 50;
                
                if (startX - endX > swipeThreshold) {
                    // Swipe left - next slide
                    nextSlide();
                } else if (endX - startX > swipeThreshold) {
                    // Swipe right - previous slide
                    prevSlide();
                }
            }
        });
    </script>
</body>
</html>
